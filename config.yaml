# ============================================
# CONFIGURAÇÕES DO PROJETO LSTM STOCK PREDICTION
# ============================================

# Dados
data:
  # Símbolo do ativo principal
  symbol: "^GSPC"  # S&P 500

  # Símbolo do VIX (volatilidade)
  vix_symbol: "^VIX"

  # Período de dados
  start_date: "2019-01-01"
  end_date: "2024-11-01"
  interval: "1d"  # Diário

  # Split temporal (sem shuffle!)
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

  # Caminhos
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"

# Features
features:
  # Features básicas (OHLCV)
  use_ohlcv: true

  # VIX (volatilidade)
  use_vix: true

  # Returns
  use_returns: true

  # Padrões de Candles (NOVO!)
  use_candlestick_patterns: true  # Hammer, Doji, Engulfing, etc.

  # Indicadores Técnicos (NOVO!)
  use_technical_indicators: true  # RSI, MACD, Bollinger Bands, etc.

  # Médias móveis (opcional)
  use_moving_averages: false
  ma_windows: [5, 10, 20, 50]

  # Sentiment analysis (opcional - requer mais recursos)
  use_sentiment: false

# Modelo LSTM - OTIMIZADO
model:
  # Arquitetura OTIMIZADA: Balance entre capacidade e regularização
  # Baseado em análise detalhada do sistema
  sequence_length: 60  # ✅ OTIMIZADO: Reduzido para melhor eficiência

  lstm_layers:
    # ✅ OTIMIZADO: Arquitetura mais eficiente e menos propensa a overfitting
    - units: 64        # ✅ Reduzido de 96 para 64
      return_sequences: true
      dropout: 0.25    # ✅ Ajustado para melhor balance
      recurrent_dropout: 0.25  # ✅ NOVO: Dropout recorrente separado
      batch_normalization: true
    - units: 32        # ✅ Reduzido de 48 para 32
      return_sequences: true
      dropout: 0.25
      recurrent_dropout: 0.25
      batch_normalization: true
    - units: 16        # ✅ Reduzido de 24 para 16
      return_sequences: false
      dropout: 0.25
      recurrent_dropout: 0.25
      batch_normalization: true

  dense_layers:
    # ✅ OTIMIZADO: Camadas Dense mais simples
    - units: 16        # ✅ Reduzido de 24 para 16
      activation: "relu"
      dropout: 0.2
      batch_normalization: true
    - units: 8         # ✅ Reduzido de 12 para 8
      activation: "relu"
      dropout: 0.2
      batch_normalization: false
    - units: 1
      activation: null  # Linear para regressão

  # Compilação
  optimizer: "adam"
  learning_rate: 0.001  # ✅ OTIMIZADO: Aumentado de 0.0002 para 0.001 (mais agressivo inicialmente)
  loss: "mse"
  metrics: ["mae"]

# Treinamento - OTIMIZADO
training:
  batch_size: 32  # ✅ OTIMIZADO: Reduzido de 48 para 32 (melhor generalização)
  epochs: 100
  validation_split: 0.0  # Já temos validação separada

  # Early Stopping - OTIMIZADO
  early_stopping:
    monitor: "val_loss"
    patience: 15  # ✅ OTIMIZADO: Reduzido de 20 para 15 (mais responsivo)
    restore_best_weights: true
    min_delta: 0.0001  # ✅ OTIMIZADO: Aumentado de 0.00005 para 0.0001 (menos sensível a ruído)

  # Model Checkpoint
  model_checkpoint:
    monitor: "val_loss"
    save_best_only: true
    mode: "min"

  # ReduceLROnPlateau - OTIMIZADO
  reduce_lr:
    monitor: "val_loss"
    factor: 0.5
    patience: 3  # ✅ OTIMIZADO: Reduzido de 5 para 3 (mais agressivo)
    min_lr: 0.00001
    cooldown: 2  # ✅ NOVO: Período de espera após redução

# Paths do modelo
model_paths:
  model_file: "models/lstm_model.h5"
  scaler_file: "models/scaler.pkl"
  metadata_file: "models/model_info.json"

# API
api:
  title: "LSTM Stock Prediction API"
  description: "API para predição de preços de ações usando LSTM"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8000
  reload: false  # true apenas em desenvolvimento

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan> - <level>{message}</level>"
  log_file: "logs/app.log"

# Seeds para reprodutibilidade
random_state:
  numpy_seed: 42
  tensorflow_seed: 42
  python_seed: 42

# Validações anti-leakage
validation:
  # Verificar que não há data leakage
  check_temporal_order: true
  check_no_future_data: true

  # Baseline para comparação
  compare_with_baseline: true
  baseline_methods: ["naive", "moving_average"]

  # Threshold de performance suspeita (pode indicar leakage)
  max_acceptable_r2: 0.95  # R² > 0.95 é suspeito em séries temporais financeiras

# Online Learning (Auto Learning)
online_learning:
  # Habilitar retreinamento incremental
  enabled: true
  
  # Retreinar quando tiver N novos exemplos
  retrain_threshold: 200  # Aumentado: mais dados antes de retreinar (melhor generalização)
  
  # Épocas para fine-tuning (seguindo padrão do treinamento inicial)
  fine_tune_epochs: 50  # Aumentado: seguir mesmo padrão do treinamento inicial
  
  # Learning rate para fine-tuning (muito menor que treino inicial)
  fine_tune_lr: 0.00001  # Muito conservador: 10x menor que treino inicial
  
  # Usar mesmos callbacks do treinamento inicial
  use_same_callbacks: true
  
  # Validar performance antes de salvar
  validate_before_save: true
  min_improvement: 0.0  # Aceitar se não piorar (0.0) ou exigir melhoria (>0)
  
  # Caminho do buffer de dados
  buffer_path: "data/processed/online_learning_buffer.csv"
